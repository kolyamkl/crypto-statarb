services:
  db:
    image: postgres:16
    container_name: statarb-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-statarb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-statarb}
      POSTGRES_DB: ${POSTGRES_DB:-statarb}
    ports:
      # Host port 5433 to avoid clashing with other local Postgres instances (e.g. PeRatio on 5432)
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-statarb}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
