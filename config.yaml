# Single source of truth for all research parameters.
# Nothing in src/ may hard-code a value that belongs here.

data:
  # Primary market-data source. PROPOSAL pending review — see DECISIONS.md.
  exchange: binance_usdm        # USDT-margined perpetual futures
  interval: "1h"                # bar size for OHLCV and premium-index series
  start_date: "2021-01-01"      # symbols listed later simply start at listing (recorded, not backfilled)
  end_date: null                # null = ingest up to the most recent complete bar

  # Candidate universe (perp symbols). Chosen for economically plausible clusters,
  # NOT for known-good pairs — pair selection happens in M2 by cointegration.
  universe:
    - BTCUSDT                   # majors
    - ETHUSDT
    - SOLUSDT                   # L1 smart-contract cluster
    - AVAXUSDT
    - NEARUSDT
    - ADAUSDT
    - DOTUSDT
    - ATOMUSDT
    - LINKUSDT                  # oracle / infra
    - LTCUSDT                   # payments / OG cluster
    - BCHUSDT
    - DOGEUSDT
    - ARBUSDT                   # L2 cluster (listed 2023 — shorter history, kept for survivorship honesty)
    - OPUSDT

validation:
  # Everything after train_end is untouched until M5's out-of-sample evaluation.
  # Pair SELECTION already counts as tuning, so M2 may only see data <= train_end;
  # picking pairs on the full sample would leak test-period info into the strategy.
  # PROPOSAL pending review: 4y train / ~1.5y test out of the 5.5y of history.
  train_end: "2024-12-31"

pairs:
  price_field: close            # bar close of the perp
  use_log_prices: true          # hedge in log space -> beta is scale-free (a return ratio)
  min_overlap_bars: 8760        # require >=1y of joint hourly history in the training window
  adf_alpha: 0.05               # EG screen level; 91 pairs -> ~4-5 false positives expected (DECISIONS.md)
  half_life_min_bars: 24        # <1 day: reversion too fast to capture after costs on 1h bars
  half_life_max_bars: 720       # >30 days: capital tied up too long, weak stat-arb premise
  kalman:
    delta: 1.0e-5               # state-noise ratio (Chan's convention); tune on training data only
    burn_in_bars: 720           # OLS warm-up that initializes the filter; never tradeable bars

signals:
  # The M3 trading book, fixed at the M2 review (Kolya, 2026-08-22). AVAX/NEAR is
  # the only clean screen pass; ADA/DOT and ADA/LTC passed the EG gate but have
  # ~51d/~66d half-lives — including them is a DOCUMENTED post-hoc relaxation of
  # the 30d half-life bound, chosen for book diversification (see DECISIONS.md).
  # Leg order is the regression direction chosen by the M2 screen: y ~ x.
  book:
    - [AVAXUSDT, NEARUSDT]
    - [ADAUSDT, DOTUSDT]
    - [ADAUSDT, LTCUSDT]
  zscore_window_bars: 1440      # 60d rolling standardization — middle ground for the
                                # book's 28-66d half-lives; tunable in training only
  entry_z: 2.0                  # spec defaults; treated as tunable, not sacred (M5)
  exit_z: 0.0                   # exit when the spread is back at its rolling mean
  stop_z: 3.0                   # stop-out: 3 sigma says the equilibrium may have broken

backtest:
  taker_fee_bps: 5.0            # Binance USDT-M VIP0 taker (0.05%); doubled in M7 stress
  slippage_bps: 2.0             # per leg per fill — liquid majors, 1h bars; stressed in M7
  # Sizing: unit gross capital per pair when active, split 1:beta across legs so
  # the pair is return-neutral; beta frozen at entry; portfolio = equal-weight pairs.

ingest:
  request_timeout_s: 15
  max_retries: 5
  retry_backoff_s: 2.0          # exponential base: 2, 4, 8, ...
  # Binance USDT-M rate limit is 2400 weight/min; klines at limit=1500 cost weight 10,
  # so 0.35s spacing keeps us at ~70% of the cap even in the worst case.
  min_request_interval_s: 0.35
